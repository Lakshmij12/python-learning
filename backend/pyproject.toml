[project]
name = "whatsapp-ai-assistant"
version = "0.1.0"
description = "Secure, privacy-first AI WhatsApp Personal Assistant (official Cloud API)"
requires-python = ">=3.12"
readme = "../README.md"
license = { text = "MIT" }

# Core runtime dependencies — only what the code actually imports. LLM providers
# talk to REST APIs via httpx, so vendor SDKs are optional extras (see below).
dependencies = [
    # Web framework / server
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",
    "python-multipart>=0.0.9",
    # Settings / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    # Database / ORM / migrations
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",   # sync driver for Alembic migrations
    "alembic>=1.13",
    "pgvector>=0.3",
    # Cache / queue
    "redis>=5.0",
    "celery>=5.4",
    # Security / auth
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    # Observability / logging
    "structlog>=24.1",
    # HTTP client
    "httpx>=0.27",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Vendor SDKs and agent frameworks. The current adapters use httpx directly;
# install these to swap in the official SDKs or LangGraph-native orchestration.
ai = [
    "langchain>=0.2",
    "langgraph>=0.1",
    "openai>=1.30",
    "google-generativeai>=0.7",
    "anthropic>=0.28",
    "tiktoken>=0.7",
]
# Document understanding pipeline (PDF text + OCR), used by the worker tasks.
documents = [
    "pypdf>=4.2",
    "pillow>=10.3",
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-redis",
    "faker>=25.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "ASYNC"]
# S101 (assert) is fine in tests; handled by per-file ignores below.
ignore = [
    "S104",   # binding to 0.0.0.0 is intentional inside containers
    "UP042",  # str+Enum is deliberate: stable string values for DB/JSON
    "UP046",  # keep classic Generic[...] base for the repository pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "unit: fast isolated tests",
    "integration: tests touching external systems",
    "security: security-focused tests",
    "performance: performance/load tests",
]

[tool.coverage.run]
branch = true
omit = ["app/workers/celery_app.py", "tests/*"]

[tool.bandit]
exclude_dirs = ["tests"]
